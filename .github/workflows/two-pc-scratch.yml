name: Two-PC scratch PostgreSQL proof
on:
  workflow_dispatch:
  pull_request:
  push:
jobs:
  scratch-two-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scratch-only
          POSTGRES_DB: smlpos_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smlpos_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SMLPOS_E2E_TEST_DATABASE_URL: postgresql://postgres:scratch-only@127.0.0.1:5432/smlpos_e2e_test
      SMLPOS_E2E_ALLOW_SCRATCH_DB: smlpos_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix deploy/api
      - run: psql "$SMLPOS_E2E_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE powersync_role NOLOGIN;'
      - run: node --test scripts/e2e-two-pc/workload.test.mjs
      - run: node scripts/e2e-two-pc/run.mjs --seeds 50
