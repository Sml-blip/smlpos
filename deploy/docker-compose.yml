name: pos-sync-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: pos
      # used only by postgres/init.sh on first start
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      PS_PASSWORD: ${PS_PASSWORD}
      PS_STORAGE_PASSWORD: ${PS_STORAGE_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # safety valve: if PowerSync is down for long, drop the slot instead of filling the disk
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    networks: [internal]
    # NO ports: Postgres is reachable only inside the Docker network

  powersync:
    image: journeyapps/powersync-service:${POWERSYNC_VERSION:-1.27.2}
    restart: unless-stopped
    logging: *logging
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_DATA_SOURCE_URI: postgresql://powersync_role:${PS_PASSWORD}@postgres:5432/pos
      PS_STORAGE_URI: postgresql://powersync_storage_user:${PS_STORAGE_PASSWORD}@postgres:5432/powersync_storage
    volumes:
      - ./powersync:/config:ro
    mem_limit: 1g
    networks: [internal]

  api:
    build: ./api            # built in Phase 1 of SYNC_IMPLEMENTATION.md
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://pos_api:${API_DB_PASSWORD}@postgres:5432/pos
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_KEY_ID: pos-key-1
      JWT_AUDIENCE: powersync
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-1.9.1038}
      LIVE_WRITES_ENABLED: ${LIVE_WRITES_ENABLED:-false}
      SEED_STAGING_ENABLED: ${SEED_STAGING_ENABLED:-false}
      SYNC2_ENABLED: ${SYNC2_ENABLED:-false}
      STAGING_ONLY: ${STAGING_ONLY:-false}
      SYNC_URL: https://sync.${DOMAIN}
      JWT_ISSUER: https://api.${DOMAIN}
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks: [internal]
    ports:
      - "127.0.0.1:13000:3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on: [api, powersync]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    networks: [internal]
    profiles: [public]

  tests:
    build: ./api
    profiles: [test]
    command: [node, --test, "test/*.test.ts"]
    environment:
      TEST_DATABASE_URL: postgresql://pos_api:${API_DB_PASSWORD}@postgres:5432/pos
    volumes:
      - ./api/test:/app/test:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:

