#cloud-config
hostname: smlpos-sync-01
manage_etc_hosts: true
timezone: UTC
disable_root: true
ssh_pwauth: false

users:
  - name: deploy
    gecos: SMLPOS deployment
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - __DEPLOY_SSH_PUBLIC_KEY__

package_update: true
packages:
  - ca-certificates
  - curl
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/00-smlpos.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
  - path: /etc/fail2ban/jail.d/smlpos-sshd.local
    owner: root:root
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: '0644'
    content: |
      {"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"},"live-restore":true}
  - path: /usr/local/sbin/smlpos-bootstrap
    owner: root:root
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec >>/var/log/smlpos-bootstrap.log 2>&1
      install -m 0755 -d /etc/apt/keyrings
      curl --fail --silent --show-error --location --retry 3 https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      cat >/etc/apt/sources.list.d/docker.sources <<'DOCKER_SOURCE'
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
      DOCKER_SOURCE
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      usermod -aG docker deploy
      install -d -m 0750 -o deploy -g deploy /opt/pos
      /usr/sbin/sshd -t
      systemctl enable --now docker
      systemctl enable --now fail2ban
      systemctl restart fail2ban
      systemctl reload ssh
      docker version
      docker compose version
      install -d -m 0755 /var/lib/smlpos
      touch /var/lib/smlpos/bootstrap-complete

runcmd:
  - [bash, /usr/local/sbin/smlpos-bootstrap]

final_message: "SMLPOS cloud-init finished. Verify /var/lib/smlpos/bootstrap-complete before deploying services."

